[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify fails a build when the value of a "secret" variable appears in the code or the built site.
  # These are not secrets: VITE_* values are meant to be in the browser bundle (the Supabase anon key is
  # public by design; RLS protects the data), and the rest are ordinary settings such as "smtp".
  # Scanning stays on for real secrets (service role key, SMTP password, API keys). Never add those here.
  SECRETS_SCAN_OMIT_KEYS = "VITE_BRAND_NAME,VITE_SITE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_WHATSAPP_NUMBER,SUPABASE_URL,EMAIL_PROVIDER,SMTP_HOST,SMTP_PORT,AZURE_STORAGE_CONTAINER"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Functions declare their own /api/* paths (see `config.path` in each function).
# Everything else falls back to the React SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ws://localhost:5173 https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://www.googletagmanager.com https://*.blob.core.windows.net; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
