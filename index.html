<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>HRMS Cloud — Payroll, Attendance &amp; HR software for Tamil Nadu businesses</title>
    <meta name="description" content="Cloud HRMS for businesses in Tirunelveli, Thoothukudi and Nagercoil. Attendance, payroll, leave and compliance in Tamil and English. Book a free demo." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HRMS Cloud — HR &amp; Payroll software" />
    <meta property="og:description" content="Attendance, payroll, leave and compliance in Tamil and English. Book a free demo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <style>
        .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f6f8fc;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;color:#0f172a}
        @media (prefers-color-scheme:dark){.boot{background:#090d18;color:#eef2fb}}
        .boot svg{width:64px;height:64px;animation:boot-pop .7s cubic-bezier(.16,1,.3,1) both}
        .boot .p{stroke-dasharray:60;stroke-dashoffset:60;animation:boot-draw 1.1s .25s cubic-bezier(.65,0,.35,1) forwards}
        .boot .d{transform-origin:23px 10px;animation:boot-dot 1.4s .9s ease-in-out infinite}
        .boot .bar{width:132px;height:3px;border-radius:9px;background:rgba(79,70,229,.15);overflow:hidden}
        .boot .bar i{display:block;width:40%;height:100%;border-radius:9px;background:#4f46e5;animation:boot-bar 1.2s ease-in-out infinite}
        @keyframes boot-pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
        @keyframes boot-draw{to{stroke-dashoffset:0}}
        @keyframes boot-dot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
        @keyframes boot-bar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
        @media (prefers-reduced-motion:reduce){.boot *{animation:none!important;stroke-dashoffset:0!important}}
      </style>
      <div class="boot" role="status" aria-label="Loading">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#4f46e5"/><path class="p" d="M9 22V10m0 6h14m0-6v12" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><circle class="d" cx="23" cy="10" r="2.6" fill="#f59e0b"/></svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
